<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oxygenated</title>
  <meta name="description" content="a personal new tab page">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- apply saved theme before first paint -->
  <script>
    if (localStorage.getItem('oxy_theme') === 'dark')
      document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</head>
<body class="loading">

  <!-- loader: diagonal dot wave that fades out (no retract) -->
  <div class="loader-overlay" id="loader-overlay">
    <canvas id="loader-wave-canvas"></canvas>
    <div class="loader-center">
      <span class="loader-text">welcome.</span>
    </div>
  </div>

  <!-- interactive dot matrix background -->
  <canvas id="dot-matrix-canvas"></canvas>

  <!-- floating top elements (no header bar) -->
  <div class="top-bar">
    <a href="https://oxygenated.uk" class="about-pill" target="_blank" rel="noopener">
      <span class="red-dot"></span>
      about me
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
    </a>
    <button class="settings-btn" id="settings-toggle" aria-label="settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.38.67 1.08 1.1 1.85 1.15H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- main content -->
  <main>
    <div class="container">

      <!-- clock + date -->
      <section class="hero">
        <span class="tz-label" id="tz-display">utc+00:00</span>
        <div class="clock-row">
          <h1 class="clock" id="clock-display">00:00</h1>
          <span class="clock-period" id="clock-period"></span>
        </div>
        <span class="date-label" id="date-display">loading...</span>
      </section>

      <!-- search -->
      <section class="search-section">
        <div class="search-box">
          <span class="search-prefix" id="search-badge">g:</span>
          <input type="text" id="search-input" placeholder="search or type a url..." autocomplete="off" spellcheck="false">
          <kbd class="search-kbd">/</kbd>
          <button class="search-go" id="search-btn" aria-label="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="engine-tags">
          <button class="engine-tag active" data-engine="google" data-prefix="g:">google</button>
          <button class="engine-tag" data-engine="duckduckgo" data-prefix="ddg:">duckduckgo</button>
          <button class="engine-tag" data-engine="github" data-prefix="gh:">github</button>
          <button class="engine-tag" data-engine="youtube" data-prefix="yt:">youtube</button>
          <button class="engine-tag" data-engine="wikipedia" data-prefix="w:">wikipedia</button>
        </div>
      </section>

      <!-- shortcuts -->
      <section class="section" id="section-shortcuts">
        <div class="section-head">
          <div class="section-label"><span class="red-dot"></span> shortcuts</div>
          <button class="btn-add" id="add-shortcut-btn">+ add</button>
        </div>
        <div class="shortcuts-grid" id="shortcuts-grid"></div>
      </section>

      <!-- daily quote -->
      <section class="section" id="section-quote">
        <div class="card quote-card">
          <div class="card-head">
            <span class="card-label"><span class="red-dot"></span> daily quote</span>
            <button class="btn-text" id="quote-refresh">refresh</button>
          </div>
          <blockquote class="quote-text" id="quote-text">loading...</blockquote>
          <div class="quote-author">
            <a id="quote-link" href="#" target="_blank" rel="noopener"></a>
            <span id="quote-author"></span>
            <span id="quote-desc"></span>
          </div>
        </div>
      </section>

      <!-- widgets: scratchpad + 3d viewport -->
      <section class="section">
        <div class="widgets-grid">

          <!-- scratchpad -->
          <div class="card scratch-card">
            <div class="card-head">
              <span class="card-label"><span class="red-dot"></span> scratchpad</span>
              <div class="card-actions">
                <span class="char-count" id="scratch-count">0</span>
                <button class="btn-text" id="clear-scratch-btn">clear</button>
              </div>
            </div>
            <textarea id="scratchpad" placeholder="notes, ideas, whatever..."></textarea>
          </div>

          <!-- 3d viewport -->
          <div class="card">
            <div class="card-head">
              <span class="card-label"><span class="red-dot"></span> 3d viewport</span>
              <span class="cad-meta" id="cad-coords">x: 0.20 y: 0.40</span>
            </div>
            <div class="cad-viewport" id="cad-viewport">
              <canvas id="cad-3d-canvas" width="380" height="240"></canvas>
              <span class="cad-hint">drag to rotate</span>
            </div>
            <div class="cad-foot">
              <span>60fps</span>
              <button class="btn-text" id="cad-mode-btn">icosahedron</button>
            </div>
          </div>

        </div>
      </section>

      <!-- page end -->
      <div class="page-end"><span class="page-end-text">made with love [oxy.]</span></div>

    </div>
  </main>

  <!-- add shortcut modal -->
  <div class="modal-bg" id="shortcut-modal">
    <div class="modal">
      <div class="modal-head">
        <span>add shortcut</span>
        <button class="modal-x" id="close-shortcut-modal">&times;</button>
      </div>
      <form id="shortcut-form">
        <div class="field">
          <label for="shortcut-name">name</label>
          <input type="text" id="shortcut-name" placeholder="github" required>
        </div>
        <div class="field">
          <label for="shortcut-url">url</label>
          <input type="url" id="shortcut-url" placeholder="https://github.com" required>
        </div>
        <div class="field">
          <label for="shortcut-key">key (1-9, optional)</label>
          <input type="text" id="shortcut-key" maxlength="1" placeholder="5">
        </div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" id="cancel-shortcut-btn">cancel</button>
          <button type="submit" class="btn solid">save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- settings drawer (slides from right) -->
  <div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="settings-drawer">
    <div class="drawer-head">
      <span>settings</span>
      <button class="modal-x" id="close-drawer">&times;</button>
    </div>

    <div class="setting-group">
      <label>dot contrast</label>
      <div class="setting-opts" id="contrast-opts">
        <button class="opt active" data-base="0.22" data-hover="0.85">high</button>
        <button class="opt" data-base="0.35" data-hover="0.95">ultra</button>
        <button class="opt" data-base="0.12" data-hover="0.55">subtle</button>
      </div>
    </div>

    <div class="setting-group">
      <label>dot spacing</label>
      <div class="setting-opts" id="spacing-opts">
        <button class="opt" data-spacing="18">dense</button>
        <button class="opt active" data-spacing="24">balanced</button>
        <button class="opt" data-spacing="32">sparse</button>
      </div>
    </div>

    <div class="setting-group">
      <label>clock format</label>
      <div class="setting-opts">
        <button class="opt active" id="btn-24h">24h</button>
        <button class="opt" id="btn-12h">12h</button>
      </div>
    </div>

    <div class="setting-group">
      <label>seconds</label>
      <div class="setting-opts">
        <button class="opt active" id="btn-seconds-on">on</button>
        <button class="opt" id="btn-seconds-off">off</button>
      </div>
    </div>

    <div class="setting-group">
      <label>theme</label>
      <div class="setting-opts">
        <button class="opt active" id="btn-light">light</button>
        <button class="opt" id="btn-dark">dark</button>
      </div>
    </div>

    <div class="setting-group">
      <button class="btn-text danger" id="reset-shortcuts-btn">reset shortcuts</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
